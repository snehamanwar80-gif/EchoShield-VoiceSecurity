<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EchoShield</title>
<style>body{margin:0;background:#07111f;color:#edf6ff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:30px}.hero{padding:20px 0 35px}h1{font-size:45px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#0d1b2d;border:1px solid #24405c;border-radius:18px;padding:22px}.btn{padding:12px 16px;border:0;border-radius:10px;background:#37d99b;font-weight:bold;cursor:pointer;margin:5px}input{padding:11px;background:#071522;color:white;border:1px solid #39516b;border-radius:8px;width:90%}.score{font-size:42px;font-weight:bold}.muted{color:#9cb0c7}@media(max-width:750px){.grid{grid-template-columns:1fr}h1{font-size:34px}}</style></head>
<body><div class="wrap"><div class="hero"><h1>🛡️ EchoShield</h1><p class="muted">Detect fake voices before they become fraud.</p></div>
<div class="grid">
<div class="card"><h2>🎙️ Live Voice</h2><button class="btn" id="rec">Start / Stop</button><p id="live" class="muted"></p></div>
<div class="card"><h2>📁 Upload</h2><input id="file" type="file" accept="audio/*"><button class="btn" onclick="upload()">Analyze</button></div>
<div class="card"><h2>📞 Secure WebRTC</h2><input id="room" value="echoshield-demo"><button class="btn" onclick="call()">Join Call</button><p id="call" class="muted"></p></div>
<div class="card"><h2>📚 Fraud Intelligence</h2><div id="inc">Loading...</div><button class="btn" onclick="incidents()">Refresh</button></div>
</div><div id="result" class="card" style="display:none;margin-top:18px"><h2>🧠 Analysis</h2><div id="score" class="score"></div><div id="human"></div><div id="risk"></div><h2 id="decision"></h2><p id="mode" class="muted"></p></div>
<div class="card" style="margin-top:18px"><h2>🤖 Security Assistant</h2><input id="q" value="What should I do if the call is suspicious?"><button class="btn" onclick="ask()">Ask</button><p id="ans" class="muted"></p></div></div>
<script>
async function analyze(blob,name){let f=new FormData();f.append("file",blob,name);let r=await fetch("/api/voice/analyze",{method:"POST",body:f});let x=await r.json();show(x);incidents()}
function show(x){let a=x.analysis,r=x.risk;document.getElementById("result").style.display="block";document.getElementById("score").textContent="Synthetic: "+a.synthetic_score+"%";document.getElementById("human").textContent="Human/bonafide: "+a.human_score+"%";document.getElementById("risk").textContent="Risk: "+r.risk_score+"/100 ("+r.risk_level+")";document.getElementById("decision").textContent="Decision: "+r.decision;document.getElementById("mode").textContent="Mode: "+a.analysis_mode+" | Incident: "+x.incident_id}
let mr;document.getElementById("rec").onclick=async()=>{if(mr?.state==="recording"){mr.stop();return}let s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);let c=[];mr.ondataavailable=e=>c.push(e.data);mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());analyze(new Blob(c,{type:"audio/webm"}),"live.webm");document.getElementById("live").textContent="Analyzed"};mr.start();document.getElementById("live").textContent="Recording... click again to stop"}
async function upload(){let f=document.getElementById("file").files[0];if(f)analyze(f,f.name)}
async function incidents(){let d=await (await fetch("/api/fraud/incidents")).json();document.getElementById("inc").innerHTML=d.incidents.slice(0,8).map(i=>"<p><b>"+i.id+"</b> • "+i.risk_level+" • "+i.decision+" • "+i.synthetic_score+"%</p>").join("")||"No incidents yet"}
async function ask(){let q=document.getElementById("q").value;let r=await fetch("/api/assistant/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});document.getElementById("ans").textContent=(await r.json()).answer}
let pc,ws;async function call(){let room=document.getElementById("room").value;pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});let s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>pc.addTrack(t,s));ws=new WebSocket(`ws://${location.host}/ws/webrtc/${room}`);ws.onopen=()=>document.getElementById("call").textContent="Joined signaling room";ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==="offer"){await pc.setRemoteDescription(m);let a=await pc.createAnswer();await pc.setLocalDescription(a);ws.send(JSON.stringify(a))}else if(m.type==="answer"){await pc.setRemoteDescription(m)}else if(m.type==="candidate"){await pc.addIceCandidate(m.candidate)}};pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:"candidate",candidate:e.candidate}));setTimeout(async()=>{let o=await pc.createOffer();await pc.setLocalDescription(o);ws.send(JSON.stringify(o))},1000)}
incidents();
</script></body></html>
