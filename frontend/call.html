<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EchoShield Secure Call</title>

    <style>

        body {

            margin: 0;

            min-height: 100vh;

            background: #090e1d;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .call-box {

            width: 450px;

            background: #151c32;

            padding: 30px;

            border-radius: 20px;

            text-align: center;

            box-sizing: border-box;

        }

        .status {

            margin: 20px 0;

            padding: 14px;

            border-radius: 10px;

            background: #202a45;

        }

        button {

            padding: 13px 20px;

            margin: 7px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

        }

        #startBtn,
        #acceptBtn {

            background: #20a86b;

            color: white;

        }

        #rejectBtn,
        #hangupBtn {

            background: #d94b4b;

            color: white;

        }

        #copyBtn {

            background: #4f7cff;

            color: white;

        }

        .hidden {

            display: none;

        }

        #securityAlert {

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            background: #342a15;

        }

        input {

            width: 100%;

            box-sizing: border-box;

            padding: 10px;

            border-radius: 8px;

            border: none;

        }

    </style>

</head>

<body>

<div class="call-box">

    <h1>🛡️ EchoShield</h1>

    <h2>Secure Call</h2>

    <div class="status" id="status">
        Ready
    </div>

    <div id="roomSection">

        <p>Room ID</p>

        <input
            id="roomId"
            readonly
        >

        <button
            id="copyBtn"
            onclick="copyLink()"
        >
            Copy Call Link
        </button>

    </div>

    <br>

    <button
        id="startBtn"
        onclick="startCall()"
    >
        Start Call
    </button>

    <div id="incomingSection" class="hidden">

        <h3>📞 Incoming Secure Call</h3>

        <button
            id="acceptBtn"
            onclick="acceptCall()"
        >
            Accept
        </button>

        <button
            id="rejectBtn"
            onclick="rejectCall()"
        >
            Reject
        </button>

    </div>

    <div>

        <button
            id="hangupBtn"
            class="hidden"
            onclick="hangUp()"
        >
            End Call
        </button>

    </div>

    <div id="securityAlert" class="hidden">

        🛡️ EchoShield Security Alert

        <p id="alertText"></p>

    </div>

    <audio
        id="remoteAudio"
        autoplay
        controls
    ></audio>

</div>


<script src="/static/webrtc.js"></script>

</body>

</html>
